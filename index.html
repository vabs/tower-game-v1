<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tower Defence</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%231d2322%22/%3E%3Crect x=%225%22 y=%224%22 width=%226%22 height=%229%22 fill=%22%23c2b280%22/%3E%3Crect x=%227%22 y=%221%22 width=%222%22 height=%224%22 fill=%22%23c2b280%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="topbar-stat">Level <span id="hud-level">1</span></div>
        <div class="topbar-stat">Wave <span id="hud-wave">1</span></div>
        <div class="topbar-stat">HP <span id="hud-hp">25</span></div>
        <div class="topbar-stat">Coins <span id="hud-coins">200</span></div>
        <button id="hud-start" type="button">Start Wave</button>
        <button id="hud-spawn-test" type="button" hidden title="Dev sandbox: spawn 5 grunts, 3 drones, 1 tank (N)">Test wave (N)</button>
        <div class="topbar-msg" id="hud-msg"></div>
      </header>
      <div class="layout">
        <aside class="panel left-panel">
          <div class="panel-scroll">
            <h3>Towers</h3>
            <div class="hud-tower-list" id="hud-tower-list"></div>
          </div>
        </aside>
        <section class="playfield" id="playfield">
          <canvas id="game" width="960" height="528"></canvas>
          <div id="overlay" class="overlay" hidden>
            <div class="overlay-box">
              <h2 id="overlay-title"></h2>
              <p id="overlay-text"></p>
              <button id="overlay-retry" type="button">Retry</button>
            </div>
          </div>
        </section>
        <aside class="panel right-panel">
          <div class="panel-scroll">
            <h3>Selected</h3>
            <div class="hud-panel">
              <div>Name: <span id="hud-selected">None</span></div>
              <div>Level: <span id="hud-sel-level">-</span></div>
              <div>Damage: <span id="hud-damage">-</span></div>
              <div>Rate: <span id="hud-rate">-</span></div>
              <div>Range: <span id="hud-range">-</span></div>
              <div>DPS: <span id="hud-dps">-</span></div>
              <div id="hud-special" class="hud-special"></div>
              <label class="hud-target">Target
                <select id="hud-targeting" disabled>
                  <option value="first">First</option>
                  <option value="last">Last</option>
                  <option value="closest">Closest</option>
                  <option value="strongest">Strongest</option>
                </select>
              </label>
              <button id="hud-upgrade" type="button" disabled>Upgrade</button>
              <button id="hud-sell" type="button" disabled>Sell</button>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
